<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PixelCrypt - Sign In</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

</head>

<body>

<div id="particles-js"></div>

<div class="overlay"></div>

<section class="hero">

<div class="logo">

<img src="{{ url_for('static', filename='images/digital-world-map.png') }}">

</div>

<h1>

<span class="white">PIXEL</span>

<span class="blue">CRYPT</span>

</h1>

<p class="tagline">

Secure • Encrypt • Protect

</p>

<form action="/login" method="POST" class="form">

<input
type="text"
name="username"
placeholder="USERNAME"
required>

<input
type="password"
name="password"
placeholder="PASSWORD"
required>

<button type="submit">

SIGN IN

</button>

</form>

<p class="form-link">

Don't have an account?

<a href="{{ url_for('register_page') }}">

Register

</a>

</p>

</section>

<script src="{{ url_for('static', filename='js/background.js') }}"></script>

</body>

</html>

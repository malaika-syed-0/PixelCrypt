<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PixelCrypt</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#020916;

font-family:Poppins,sans-serif;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

color:white;

}

.popup{

width:520px;

background:#0b1d34;

border-radius:22px;

padding:40px;

text-align:center;

border:2px solid {{ color }};

box-shadow:0 0 25px {{ shadow }};

}

.popup h1{

font-family:Orbitron;

font-size:30px;

color:{{ color }};

margin-bottom:20px;

}

.popup p{

font-size:18px;

line-height:30px;

margin-bottom:35px;

white-space:pre-wrap;

word-break:break-word;

max-height:260px;

overflow-y:auto;

padding:10px;

background:#071729;

border-radius:12px;

}

.popup a{

display:inline-block;

padding:14px 32px;

border-radius:12px;

text-decoration:none;

font-family:Orbitron;

font-size:16px;

background:#00bfff;

color:white;

transition:.3s;

}

.popup a:hover{

box-shadow:0 0 20px #00bfff;

}

</style>

</head>

<body>

<div class="popup">

<h1>

{{ title }}

</h1>

<p>

{{ message }}

</p>

{% if back == "/download" %}

<a href="/download">

⬇ Download Image

</a>

<br><br>

<a href="/encode">

OK

</a>

{% else %}

<a href="{{ back }}">

OK

</a>

{% endif %}

</div>

</body>

</html>

<!DOCTYPE html>
<html>
<head>
    <title>StegoApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="text-center mb-4">
            Secure Image Steganography
        </h1>

        <form action="/encode" method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">
                    Select PNG Image
                </label>

                <input type="file"
                       class="form-control"
                       name="image"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Secret Message
                </label>

                <textarea class="form-control"
                          name="message"
                          rows="4"
                          required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       class="form-control"
                       name="password"
                       required>
            </div>

            <button class="btn btn-primary w-100">
                Hide Message
            </button>

        </form>

    </div>

</div>

</body>
</html>
